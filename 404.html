<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 – Trang không tồn tại</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  font-family:-apple-system,'Segoe UI',Arial,sans-serif;
  background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);
  color:#fff;text-align:center;padding:24px;
}
.wrap{max-width:360px;width:100%}
.emoji{font-size:72px;margin-bottom:16px;animation:float 3s ease-in-out infinite}
@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-16px)}
}
.num{
  font-size:96px;font-weight:900;line-height:1;
  background:linear-gradient(135deg,#e02020,#ff6b35);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  margin-bottom:12px;letter-spacing:-4px;
}
h1{font-size:22px;font-weight:800;margin-bottom:10px;color:#fff}
p{font-size:14px;color:rgba(255,255,255,.6);line-height:1.7;margin-bottom:32px}
.btn{
  display:inline-block;
  background:linear-gradient(135deg,#e02020,#ff6b35);
  color:#fff;font-weight:700;font-size:15px;
  padding:14px 36px;border-radius:30px;
  text-decoration:none;letter-spacing:.3px;
  box-shadow:0 8px 24px rgba(224,32,32,.4);
  transition:transform .2s,box-shadow .2s;
}
.btn:active{transform:scale(.97)}
.dots{margin-top:40px;display:flex;justify-content:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.2)}
.dot:nth-child(1){background:#e02020;animation:pulse 1.4s ease-in-out infinite}
.dot:nth-child(2){animation:pulse 1.4s ease-in-out .2s infinite}
.dot:nth-child(3){animation:pulse 1.4s ease-in-out .4s infinite}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="emoji">😔</div>
  <div class="num">404</div>
  <h1>Trang không tồn tại</h1>
  <p>Trang bạn đang tìm kiếm không tồn tại hoặc đã bị xoá.<br>Hãy kiểm tra lại đường dẫn.</p>
  <a class="btn" href="/">← Về trang chủ</a>
  <div class="dots">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
</div>
</body>
</html>
